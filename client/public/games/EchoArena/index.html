<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>EchoArena</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

	</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<script>
		window.onHighscoreChanged = function(value) {
			// Prevents error in case not set
		};
		window.onZeroKillsDeath = function(value) {
			// Prevents error in case not set
		};
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {
	args: [],
	canvasResizePolicy: 2,
	emscriptenPoolSize: 8,
	ensureCrossOriginIsolationHeaders: true,
	executable: "index",
	experimentalVK: false,
	fileSizes: {
		"index.pck": 9859080,
		"index.wasm": 39513091
	},
	focusCanvas: true,
	gdextensionLibs: [],
	godotPoolSize: 4
};

const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED
	});

	if (missing.length !== 0) {

		if (
			GODOT_CONFIG.serviceWorker &&
			GODOT_CONFIG.ensureCrossOriginIsolationHeaders &&
			"serviceWorker" in navigator
		) {

			let registrationPromise;

			try {
				registrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				registrationPromise = Promise.reject(err);
			}

			Promise.race([
				registrationPromise
					.then(reg => {
						if (reg) {
							throw new Error("Service worker already exists.");
						}
						return engine.installServiceWorker();
					}),
				new Promise(resolve => setTimeout(resolve, 2000))
			]).then(() => {
				location.reload();
			}).catch(console.error);

			return;
		}

		console.error(
			"Missing required browser features:\n" +
			missing.join("\n")
		);

		return;
	}

	engine.startGame({

		onProgress(current, total) {

			window.parent.postMessage({
				type: "godot-progress",
				progress: total > 0 ? current / total : 0
			}, "*");

		}

	}).catch(console.error);

})();
		</script>
	</body>
</html>
